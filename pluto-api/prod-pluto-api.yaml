apiVersion: apps/v1
kind: Deployment
metadata:
  name: pluto-api-deployment
  namespace: pluto
  labels:
    app: pluto-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pluto-api
  template:
    metadata:
      labels:
        app: pluto-api
    spec:
      containers:
        - name: pluto-api
          image: ghcr.io/prettygoodorg/pluto-api:prod-latest
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: pluto-api-service
  namespace: pluto
spec:
  type: ClusterIP
  selector:
    app: pluto-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pluto-api-ingress
  namespace: pluto
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "*.wichan.dev"
    secretName: wichan-dev-tls-secret
  rules:
  - host: api.wichan.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pluto-api-service
            port:
              number: 8080